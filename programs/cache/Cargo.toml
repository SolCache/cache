[package]
name = "cache"
version = "0.1.0"
description = "Cache: round-ups from every trade, invested into xStocks"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "cache"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "0.31.1"
anchor-spl = "0.31.1"
