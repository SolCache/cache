name = "amber-otter-lantern"
main = "worker/index.ts"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
binding = "ASSETS"
html_handling = "auto-trailing-slash"

[triggers]
crons = ["*/15 * * * *"]

[vars]
PROGRAM_ID = "__PROGRAM_ID__"
MIN_SWEEP_USD = "1"
SLIPPAGE_BPS = "100"

[[d1_databases]]
binding = "DB"
database_name = "cache"
database_id = "__D1_ID__"

