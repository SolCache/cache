name: Cache

# Every push to main only BUILDS: it compiles the program, type-checks and builds the site,
# and reports what a deploy would cost. Nothing is sent onchain and no SOL is spent.
#
# Deploying is manual (Actions → Cache → Run workflow) and each step is a separate switch:
#   deploy_program  – uploads the program to mainnet (spends SOL from the deployer wallet)
#   deploy_site     – publishes the site and keeper to Cloudflare (no SOL)
#   init_config     – writes the program's config onchain (small SOL fee)
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_program:
        description: "Deploy the program to mainnet (spends SOL)"
        type: boolean
        default: false
      deploy_site:
        description: "Deploy site + keeper to Cloudflare (no SOL)"
        type: boolean
        default: false
      init_config:
        description: "Initialize/update program config onchain (small SOL fee)"
        type: boolean
        default: false
      keeper_topup_sol:
        description: "SOL to send the keeper during init (0 = none)"
        type: string
        default: "0"
      workers_subdomain:
        description: "Change the account's workers.dev subdomain to this (blank = leave it)"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: cache-${{ github.ref }}
  cancel-in-progress: false

env:
  SOLANA_VERSION: "2.1.21"
  ANCHOR_VERSION: "0.31.1"
  RPC_URL: https://mainnet.helius-rpc.com/?api-key=${{ secrets.HELIUS_API_KEY }}

jobs:
  # ------------------------------------------------------------------ build (no spending)
  build-program:
    name: Build program
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache toolchains
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/solana
            ~/.cache/solana
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/anchor
            target
          key: v2-sol-${{ env.SOLANA_VERSION }}-anchor-${{ env.ANCHOR_VERSION }}-${{ hashFiles('programs/**/Cargo.toml') }}

      - name: Install Solana CLI
        run: |
          if [ ! -x "$HOME/.local/share/solana/install/active_release/bin/solana" ]; then
            sh -c "$(curl -sSfL https://release.anza.xyz/v${SOLANA_VERSION}/install)"
          fi
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Install Anchor CLI
        run: |
          if ! anchor --version 2>/dev/null | grep -q "${ANCHOR_VERSION}"; then
            cargo install --git https://github.com/coral-xyz/anchor --tag v${ANCHOR_VERSION} anchor-cli --locked --force
          fi
          anchor --version

      - name: Versions
        run: |
          solana --version
          anchor --version
          cargo --version

      - name: Lock dependencies to versions Solana's compiler supports
        run: |
          if [ ! -f Cargo.lock ]; then
            rustup toolchain install stable --profile minimal
            CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS=fallback cargo +stable generate-lockfile
            # Crates that don't declare their Rust version but need edition 2024:
            cargo +stable update -p blake3 --precise 1.5.5
            echo "NEW_LOCKFILE=true" >> "$GITHUB_ENV"
          fi

      - name: Use a throwaway program address for testing
        run: |
          solana-keygen new --no-bip39-passphrase --silent --force -o /tmp/test-program.json
          TEST_PROGRAM_ID=$(solana-keygen pubkey /tmp/test-program.json)
          sed -i "s/declare_id!(\"[^\"]*\")/declare_id!(\"$TEST_PROGRAM_ID\")/" programs/cache/src/lib.rs
          echo "TEST_PROGRAM_ID=$TEST_PROGRAM_ID" >> "$GITHUB_ENV"

      - name: Build
        run: |
          anchor build --no-idl
          ls -la target/deploy

      - name: Explain too-new dependencies
        if: failure()
        run: |
          for c in hybrid-array@0.4.15 digest@0.11.3 cpufeatures@0.3.1 crypto-common@0.2.2; do
            echo "=== $c ==="; cargo +stable tree -i "$c" -e normal --target all 2>&1 | head -40 || true
          done
          grep -A2 -E '^name = "(block-buffer|digest|sha2|crypto-common|hybrid-array|cpufeatures)"' Cargo.lock || true

      - name: Save lockfile
        if: env.NEW_LOCKFILE == 'true' && github.event_name == 'push'
        run: |
          git config user.name "cache-deploy-bot"
          git config user.email "actions@users.noreply.github.com"
          git status --short
          git add Cargo.lock
          git commit -m "Pin Rust dependencies for the Solana toolchain"
          git pull --rebase --autostash origin main
          git push origin HEAD:main

      - name: Test on a local validator (free, nothing on mainnet)
        run: |
          cd web && npm install --no-audit --no-fund --silent
          TEST_AUTH=$(npx tsx scripts/localnet-accounts.ts)
          solana-test-validator --reset --quiet --ledger /tmp/ledger \
            --upgradeable-program "$TEST_PROGRAM_ID" ../target/deploy/cache.so "$TEST_AUTH" \
            --account EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v /tmp/localnet/usdc.json > /tmp/validator.log 2>&1 &
          for i in $(seq 1 90); do solana cluster-version --url http://127.0.0.1:8899 > /dev/null 2>&1 && break; sleep 1; done
          set -o pipefail
          npx tsx scripts/localnet-test.ts 2>&1 | tee /tmp/test.log
          { echo "### Local validator test"; echo '```'; cat /tmp/test.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Validator log
        if: failure()
        run: tail -50 /tmp/validator.log || true

      - name: Report deploy cost (read-only)
        env:
          DEPLOYER_PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
        run: |
          SIZE=$(stat -c%s target/deploy/cache.so)
          solana config set --url "$RPC_URL" > /dev/null
          RENT=$(solana rent $((SIZE + 45)) --lamports | grep -oE '[0-9]+' | head -1)
          BUFFER=$(solana rent $((SIZE + 37)) --lamports | grep -oE '[0-9]+' | head -1)
          NEED=$((RENT + BUFFER + 50000000))
          SOL() { awk -v l="$1" 'BEGIN{printf "%.3f", l/1e9}'; }
          BAL="unknown"
          if [ -n "$DEPLOYER_PRIVATE_KEY" ]; then
            cd web && npm install --no-audit --no-fund --silent && cd ..
            DEPLOYER=$(cd web && npx tsx scripts/deployer-key.ts /tmp/deployer.json)
            BAL=$(SOL "$(solana balance "$DEPLOYER" --lamports | grep -oE '[0-9]+' | head -1)")
            rm -f /tmp/deployer.json
          fi
          {
            echo "### Program built (nothing deployed)"
            echo "- Size: $SIZE bytes"
            echo "- A first deploy needs **$(SOL $NEED) SOL** in the deployer wallet; **$(SOL $BUFFER) SOL** comes back right after (upload buffer), **$(SOL $RENT) SOL** stays locked as program rent (refundable if the program is closed)."
            echo "- Deployer \`${DEPLOYER:-not set}\` balance: $BAL SOL"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: cache-program
          path: target/deploy/cache.so

  build-web:
    name: Build site and worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - name: Type-check
        run: npm run typecheck
      - name: Build site
        run: npx vite build
      - name: Bundle worker (dry run, nothing uploaded)
        run: |
          sed -i "s/__D1_ID__/00000000-0000-0000-0000-000000000000/; s/__PROGRAM_ID__/11111111111111111111111111111111/" wrangler.toml
          npx wrangler deploy --dry-run --outdir /tmp/worker-dry

  # ------------------------------------------------------------------ deploy (manual only)
  deploy-program:
    name: Deploy program (spends SOL)
    needs: [build-program, build-web]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_program }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/solana
            ~/.cache/solana
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/anchor
            target
          key: v2-sol-${{ env.SOLANA_VERSION }}-anchor-${{ env.ANCHOR_VERSION }}-${{ hashFiles('programs/**/Cargo.toml') }}
      - name: Install toolchains
        run: |
          if [ ! -x "$HOME/.local/share/solana/install/active_release/bin/solana" ]; then
            sh -c "$(curl -sSfL https://release.anza.xyz/v${SOLANA_VERSION}/install)"
          fi
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
          anchor --version 2>/dev/null | grep -q "${ANCHOR_VERSION}" || cargo install --git https://github.com/coral-xyz/anchor --tag v${ANCHOR_VERSION} anchor-cli --locked --force
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Deployer wallet
        env:
          DEPLOYER_PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
        working-directory: web
        run: |
          npm install --no-audit --no-fund
          DEPLOYER=$(npx tsx scripts/deployer-key.ts)
          echo "DEPLOYER=$DEPLOYER" >> "$GITHUB_ENV"
          solana config set --url "$RPC_URL" --keypair "$HOME/.config/solana/id.json" > /dev/null
          echo "Deployer: $DEPLOYER"
          solana balance
      - name: Program address
        run: |
          mkdir -p target/deploy deploy
          if [ -f deploy/program-id.txt ]; then
            PROGRAM_ID=$(cat deploy/program-id.txt); echo "FIRST_DEPLOY=false" >> "$GITHUB_ENV"
          else
            solana-keygen new --no-bip39-passphrase --silent --force -o target/deploy/cache-keypair.json
            PROGRAM_ID=$(solana-keygen pubkey target/deploy/cache-keypair.json); echo "FIRST_DEPLOY=true" >> "$GITHUB_ENV"
          fi
          sed -i "s/declare_id!(\"[^\"]*\")/declare_id!(\"$PROGRAM_ID\")/" programs/cache/src/lib.rs
          sed -i "s/^cache = \".*\"/cache = \"$PROGRAM_ID\"/" Anchor.toml
          echo "PROGRAM_ID=$PROGRAM_ID" >> "$GITHUB_ENV"
      - name: Build with program address
        run: anchor build --no-idl
      - name: Check balance
        run: |
          SIZE=$(stat -c%s target/deploy/cache.so)
          RENT=$(solana rent $((SIZE + 45)) --lamports | grep -oE '[0-9]+' | head -1)
          BUFFER=$(solana rent $((SIZE + 37)) --lamports | grep -oE '[0-9]+' | head -1)
          BAL=$(solana balance --lamports | grep -oE '[0-9]+' | head -1)
          if [ "$FIRST_DEPLOY" = "true" ]; then NEED=$((RENT + BUFFER + 50000000)); else NEED=$((BUFFER + 50000000)); fi
          if [ "$BAL" -lt "$NEED" ]; then
            echo "::error::Deployer needs $(awk -v l=$((NEED-BAL)) 'BEGIN{printf "%.3f", l/1e9}') more SOL."
            exit 1
          fi
      - name: Deploy
        run: |
          if [ "$FIRST_DEPLOY" = "true" ]; then
            solana program deploy target/deploy/cache.so --program-id target/deploy/cache-keypair.json \
              --with-compute-unit-price 200000 --max-sign-attempts 100 --use-rpc
          else
            SIZE=$(stat -c%s target/deploy/cache.so)
            CUR=$(solana program show "$PROGRAM_ID" --output json | python3 -c 'import sys,json; print(json.load(sys.stdin)["dataLen"])')
            if [ "$SIZE" -gt "$CUR" ]; then solana program extend "$PROGRAM_ID" $((SIZE - CUR + 2048)); fi
            solana program deploy target/deploy/cache.so --program-id "$PROGRAM_ID" \
              --with-compute-unit-price 200000 --max-sign-attempts 100 --use-rpc
          fi
          solana program show "$PROGRAM_ID"
      - name: Recover SOL from a failed upload
        if: failure()
        run: solana program close --buffers || true
      - name: Record deployment
        run: |
          echo "$PROGRAM_ID" > deploy/program-id.txt
          git config user.name "cache-deploy-bot"
          git config user.email "actions@users.noreply.github.com"
          git add deploy programs/cache/src/lib.rs Anchor.toml
          git commit -m "Deploy program $PROGRAM_ID" || exit 0
          git pull --rebase --autostash origin main
          git push origin HEAD:main

  deploy-site:
    name: Deploy site and keeper (Cloudflare, no SOL)
    needs: [build-program, build-web, deploy-program]
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.deploy_site && needs.build-web.result == 'success' && needs.deploy-program.result != 'failure' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npx vite build
      - name: Database
        run: |
          find_id() { npx wrangler d1 list --json | python3 -c 'import sys,json; print(next((d["uuid"] for d in json.load(sys.stdin) if d["name"]=="cache"), ""))'; }
          ID=$(find_id)
          if [ -z "$ID" ]; then npx wrangler d1 create cache; ID=$(find_id); fi
          [ -n "$ID" ] || { echo "::error::Could not create or find the D1 database"; exit 1; }
          sed -i "s/__D1_ID__/$ID/" wrangler.toml
          npx wrangler d1 execute cache --remote --file=worker/schema.sql --yes
          for m in worker/migrations/*.sql; do
            npx wrangler d1 execute cache --remote --file="$m" --yes || echo "Migration $m already applied"
          done
      - name: Configure
        run: |
          [ -f ../deploy/program-id.txt ] || { echo "::error::Deploy the program first."; exit 1; }
          sed -i "s/__PROGRAM_ID__/$(cat ../deploy/program-id.txt)/" wrangler.toml
      - name: Change workers.dev subdomain
        if: ${{ inputs.workers_subdomain != '' }}
        continue-on-error: true
        env:
          SUB: ${{ inputs.workers_subdomain }}
        run: |
          curl -sS -X PUT "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" \
            --data "{\"subdomain\":\"$SUB\"}" | python3 -c 'import sys,json; r=json.load(sys.stdin); print(json.dumps(r.get("result") or r.get("errors"))); sys.exit(0 if r.get("success") else 1)'

      - name: Deploy worker
        run: |
          npx wrangler deploy 2>&1 | tee deploy.log
          URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "### Cache is live: $URL (app: $URL/app)" >> "$GITHUB_STEP_SUMMARY"
      - name: Secrets
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
          JUPITER_API_KEY: ${{ secrets.JUPITER_API_KEY }}
        run: |
          printf '%s' "$HELIUS_API_KEY" | npx wrangler secret put HELIUS_API_KEY
          if [ -n "$JUPITER_API_KEY" ]; then printf '%s' "$JUPITER_API_KEY" | npx wrangler secret put JUPITER_API_KEY; fi
          if [ ! -f ../deploy/keeper-pubkey.txt ]; then
            npx tsx scripts/keeper-keygen.ts | npx wrangler secret put KEEPER_SECRET_KEY
            git config user.name "cache-deploy-bot"
            git config user.email "actions@users.noreply.github.com"
            git add ../deploy/keeper-pubkey.txt
            git commit -m "Create keeper $(cat ../deploy/keeper-pubkey.txt)"
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi
          echo "Keeper: $(cat ../deploy/keeper-pubkey.txt)"

  init-config:
    name: Initialize program config (small SOL fee)
    needs: [deploy-site]
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.init_config && needs.deploy-site.result != 'failure' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - name: Init or update config
        env:
          DEPLOYER_PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
          KEEPER_TOPUP_SOL: ${{ inputs.keeper_topup_sol }}
        run: npx tsx scripts/init-config.ts
